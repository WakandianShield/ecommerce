services:
  edge_blue:
    image: nginx:alpine
    volumes:
      - ./blue/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./blue/site:/usr/share/nginx/html:ro
    ports:
      - "8082:80"
    networks:
      - frontnet

  edge_green:
    image: nginx:alpine
    volumes:
      - ./green/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./green/site:/usr/share/nginx/html:ro
    ports:
      - "8083:80"
    networks:
      - frontnet

  proxy:
    image: nginx:alpine
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/active.conf:/etc/nginx/conf.d/active.conf:ro
    ports:
      - "8081:80"
    depends_on:
      - edge_blue
      - edge_green
    networks:
      - frontnet

networks:
  frontnet:
    driver: bridge

    
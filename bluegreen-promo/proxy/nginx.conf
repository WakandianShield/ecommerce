events {}

http {
    upstream edge_blue {
        server edge_blue:80; 
    }

    upstream edge_green {
        server edge_green:80; 
    }

    map $cookie_version_test $active_upstream {
        "verde"   edge_green;
        "azul"    edge_blue;
        default   $entorno_por_defecto; 
    }

    server {
        listen 80;

        include /etc/nginx/conf.d/active.conf;

        location / {
            proxy_pass http://$active_upstream;
            
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
